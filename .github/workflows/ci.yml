name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt + clippy + test + audit
    # Runs on the local self-hosted macOS runner (`mac-local`). GitHub-hosted
    # runners are reserved for the release workflow only — see release.yml.
    runs-on: [self-hosted, macos]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      # No actions/cache step on self-hosted: the runner's $CARGO_HOME and
      # `target/` persist between jobs naturally. Adding the cache action
      # would duplicate the work and burn cache storage for no gain.

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets

      - name: cargo test
        run: cargo test --all-targets

      - name: Install cargo-audit (skip if already present)
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi

      - name: cargo audit
        run: cargo audit

  deny:
    name: cargo-deny (no-network invariant + license + advisories)
    # Same self-hosted runner — cargo-deny is cross-platform and runs fine
    # on the macOS box.
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-deny (skip if already present)
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --locked
          fi

      - name: cargo deny check
        run: cargo deny check bans advisories sources licenses
